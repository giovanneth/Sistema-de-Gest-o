<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Sistema de Gestão</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-produtos">
    <div id="menu-include"></div>
    <script src="js/include.js"></script>

    <div class="container">
        <div class="page-header">
            <h2>Controle de Produtos</h2>
            <button onclick="openProdutoModal()" class="btn btn-primary">Novo Produto</button>
        </div>

        <div class="table-container">
            <table class="data-table responsive-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="produtosTableBody">
                    <!-- Produtos serão inseridos aqui via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Adicionar Estoque -->
    <div id="estoqueModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="estoqueModalTitle">Adicionar Estoque</h3>
                <span class="close" onclick="closeEstoqueModal()">&times;</span>
            </div>
            <form id="estoqueForm">
                <input type="hidden" id="estoqueProdutoId">
                <div class="form-group">
                    <label>Produto</label>
                    <p id="estoqueProdutoNome" style="padding: 10px; background: var(--bg-secondary); border-radius: 4px; margin: 0;"></p>
                </div>
                <div class="form-group">
                    <label>Estoque Atual</label>
                    <p id="estoqueAtual" style="padding: 10px; background: var(--bg-secondary); border-radius: 4px; margin: 0;"></p>
                </div>
                <div class="form-group">
                    <label for="estoqueQuantidade">Quantidade a Adicionar</label>
                    <input type="number" id="estoqueQuantidade" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label>Novo Estoque</label>
                    <p id="estoqueNovo" style="padding: 10px; background: var(--bg-secondary); border-radius: 4px; margin: 0; font-weight: bold;"></p>
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="closeEstoqueModal()" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Produto -->
    <div id="produtoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Novo Produto</h3>
                <span class="close" onclick="closeProdutoModal()">&times;</span>
            </div>
            <form id="produtoForm">
                <input type="hidden" id="produtoId">
                <div class="form-group">
                    <label for="produtoNome">Nome do Produto</label>
                    <input type="text" id="produtoNome" required>
                </div>
                
                <div class="form-group">
                    <label for="produtoCategoria">Categoria</label>
                    <input type="text" id="produtoCategoria" placeholder="Ex: Espetinho, Bebida, Acompanhamento" required>
                </div>
                
                <div class="form-group">
                    <label for="produtoPreco">Preço (R$)</label>
                    <input type="number" id="produtoPreco" step="0.01" min="0" required>
                </div>
                
                <div class="form-group">
                    <label for="produtoEstoque">Estoque Inicial</label>
                    <input type="number" id="produtoEstoque" min="0" value="0" required>
                </div>
                
                <div class="modal-actions">
                    <button type="button" onclick="closeProdutoModal()" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/produtos.js"></script>
</body>
</html>
