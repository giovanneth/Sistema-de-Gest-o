<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro - Sistema de Gestão</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-financeiro">
    <div id="menu-include"></div>
    <script src="js/include.js"></script>

    <div class="container">
        <div class="page-header">
            <h2>Controle Financeiro</h2>
            <div class="header-actions">
                <button onclick="openTransacaoModal('entrada')" class="btn btn-success">Nova Entrada</button>
                <button onclick="openTransacaoModal('saida')" class="btn btn-danger">Nova Saída</button>
            </div>
        </div>

        <div class="financeiro-summary">
            <div class="summary-card">
                <h3>Total de Entradas</h3>
                <p class="summary-value positive" id="totalEntradas">R$ 0,00</p>
            </div>
            <div class="summary-card">
                <h3>Total de Saídas</h3>
                <p class="summary-value negative" id="totalSaidas">R$ 0,00</p>
            </div>
            <div class="summary-card">
                <h3>Saldo</h3>
                <p class="summary-value" id="saldoTotal">R$ 0,00</p>
            </div>
        </div>

        <div class="filter-bar">
            <select id="filterTipo" onchange="filterTransacoes()">
                <option value="all">Todas</option>
                <option value="entrada">Entradas</option>
                <option value="saida">Saídas</option>
            </select>
            <input type="month" id="filterMonth" onchange="filterTransacoes()">
        </div>

        <div class="table-container">
            <table class="data-table responsive-table">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Tipo</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="transacoesTableBody">
                    <!-- Transações serão inseridas aqui via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Transação -->
    <div id="transacaoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Nova Transação</h3>
                <span class="close" onclick="closeTransacaoModal()">&times;</span>
            </div>
            <form id="transacaoForm">
                <input type="hidden" id="transacaoId">
                <input type="hidden" id="transacaoTipo">
                
                <div class="form-group">
                    <label for="transacaoDescricao">Descrição</label>
                    <input type="text" id="transacaoDescricao" required>
                </div>
                
                <div class="form-group">
                    <label for="transacaoCategoria">Categoria</label>
                    <input type="text" id="transacaoCategoria" 
                           placeholder="Ex: Compra de carne, Gás, Aluguel" required>
                </div>
                
                <div class="form-group">
                    <label for="transacaoValor">Valor (R$)</label>
                    <input type="number" id="transacaoValor" step="0.01" min="0" required>
                </div>
                
                <div class="form-group">
                    <label for="transacaoData">Data</label>
                    <input type="date" id="transacaoData" required>
                </div>
                
                <div class="modal-actions">
                    <button type="button" onclick="closeTransacaoModal()" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/financeiro.js"></script>
</body>
</html>
